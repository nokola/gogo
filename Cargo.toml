[workspace]
resolver = "3"
members = ["crates/gogo-ui", "crates/gogo-text", "crates/gogo-wgpu", "crates/storvald", "examples/window"]
# `scripts/test-packages.sh` unpacks the crates.io packages under target/ and
# runs their tests there; without this line cargo would take them for
# members that the list above forgot.
exclude = ["target"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nokola/storvald"
