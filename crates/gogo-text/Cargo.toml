[package]
name = "text"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# The system font scan (`TextEngine::load_system_fonts`): cosmic-text's own
# fontdb pin, with the file-system features it leaves off — `fs` reads the
# OS font folders, `memmap` maps the files instead of copying a phone's
# whole /system/fonts into memory.
fontdb = { version = "0.23.0", default-features = false, features = ["std", "fs", "memmap"] }
gogo-ui = { workspace = true }
